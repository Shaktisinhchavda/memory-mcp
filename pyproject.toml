[project]
name = "memory-mcp"
version = "0.1.0"
description = "Personal MCP Ecosystem — unified semantic context for AI agents"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0.0",
    "watchdog>=6.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # Phase 2 — Data Connectors
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    # Phase 3 — Knowledge Graph
    "neo4j>=5.0.0",
    # Phase 4 — Unified Gateway
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.scripts]
memory-mcp = "core_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core_mcp", "config", "connectors", "knowledge_graph", "gateway"]
